<head>
<meta charset="UTF-8">

<title>千琇 · Magic Codex</title>

<style>
    body {
        margin: 0;
        background: #0e0b16; /* 深紫黑 */
        font-family: "Noto Sans TC", sans-serif;
        color: #f8f1e9; /* 白金 */
        overflow-x: hidden;
    }

    /* 星光背景 */
    .stars {
        position: fixed;
        width: 100%;
        height: 100%;
        background: url('https://i.imgur.com/9E5fFB8.png');
        background-size: cover;
        opacity: 0.15;
        z-index: -1;
    }

    /* Hero 區 */
    .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 100px 10%;
        height: 80vh;
    }

    .hero-text h1 {
        font-size: 50px;
        margin: 0;
        color: #d4b483; /* 金色 */
    }

    .hero-text h2 {
        font-size: 22px;
        opacity: 0.7;
        margin-top: 10px;
    }

    .hero-text p {
        margin-top: 30px;
        max-width: 420px;
        line-height: 1.7;
        font-size: 18px;
        opacity: 0.85;
    }

    /*========= 魔導書動畫區域 =========*/
    .book-container {
        position: relative;
        width: 340px;
        height: 260px;
        perspective: 1200px;
    }

    .book {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
    }

    /* 書本封面 */
    .cover {
        position: absolute;
        width: 100%;
        height: 100%;
        background: url('cover.png') center/cover no-repeat;
        border: 3px solid #d4b483;
        border-radius: 8px;
        z-index: 5;
    }

    /* 左右兩側書頁 */
    .page {
        position: absolute;
        width: 100%;
        height: 100%;
        background: url('page1.png') center/cover no-repeat;
        border-radius: 6px;
        border: 2px solid #d4b483;
        transform-origin: left;
        animation: flip 6s infinite ease-in-out;
    }

    /* 第二頁 */
    .page2 {
        animation-delay: 1.5s;
        background-image: url('page2.png');
    }

    /* 第三頁 */
    .page3 {
        animation-delay: 3s;
        background-image: url('page3.png');
    }

    @keyframes flip {
        0%   { transform: rotateY(0deg); }
        40%  { transform: rotateY(-180deg); }
        60%  { transform: rotateY(-180deg); }
        100% { transform: rotateY(0deg); }
    }

    /*========= 三大導航按鈕 =========*/
    .nav-buttons {
        text-align: center;
        margin-top: 40px;
    }

    .nav-buttons a {
        display: inline-block;
        margin: 10px 20px;
        padding: 14px 32px;
        border-radius: 12px;
        text-decoration: none;
        color: #f8f1e9;
        border: 2px solid #d4b483;
        transition: 0.25s;
        background: rgba(255,255,255,0.05);
    }

    .nav-buttons a:hover {
        box-shadow: 0 0 12px #d4b483;
        transform: translateY(-5px);
    }

    /*========= 分隔光條 =========*/
    .divider {
        margin: 80px auto;
        width: 80%;
        height: 4px;
        background: linear-gradient(90deg, transparent, #d4b483, transparent);
    }

    /*========= 作品卡片 =========*/
    .cards {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        padding-bottom: 100px;
    }

    .card {
        width: 280px;
        background: rgba(255,255,255,0.05);
        border-radius: 16px;
        border: 2px solid #4c2a85;
        padding-bottom: 20px;
        text-align: center;
        transition: 0.3s;
    }

    .card:hover {
        box-shadow: 0 0 16px #d4b483;
        transform: translateY(-10px);
    }

    .card img {
        width: 100%;
        border-radius: 16px 16px 0 0;
    }

    .card h3 {
        font-size: 22px;
        margin-top: 16px;
        color: #d4b483;
    }

    .card p {
        font-size: 15px;
        opacity: 0.8;
        padding: 0 16px;
    }

    .footer {
        opacity: 0.6;
        text-align: center;
        padding: 40px;
        font-size: 14px;
    }

.book-container {
    position: relative;
    width: 350px;
    height: 350px;
    perspective: 1600px;
}

.book {
    position: relative;
    width: 100%;
    height: 100%;
}

.page, .cover {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    left: 0;
    top: 0;
}

/* 頁面翻轉軸心：往下翻 */
.page {
    transform-origin: bottom center;
    animation: flipDown 4s infinite ease-in-out;
    backface-visibility: hidden;
}

/* 讓每頁緊貼後面的頁面 */
.p1 { z-index: 4; animation-delay: 0s; }
.p2 { z-index: 3; animation-delay: 0.6s; }
.p3 { z-index: 2; animation-delay: 1.2s; }

/* 最底層封面 */
.cover {
    z-index: 1;
}

/* 向下翻到底的動畫 */
@keyframes flipDown {
    0%   { transform: rotateX(0deg); opacity: 1; }
    20%  { transform: rotateX(-100deg); opacity: 0.9; }
    40%  { transform: rotateX(-180deg); opacity: 0.6; }
    45%  { opacity: 0; }
    100% { transform: rotateX(-180deg); opacity: 0; }
}









</style>
</head>

</div>



</section>

<div class="nav-buttons">

</div>
